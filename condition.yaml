- name: condition demo
  hosts: local
  connection: local
  vars: 
    number: 78
  tasks: 
    - name: print if the number is less than or euql to 100
      when: number < 100
      ansible.builtin.debung:
       msg: "given number {{number }} is less than or equal to 100"
    
    
     - name: print if the number is greter than to 100
       when: number > 100
       ansible.builtin.debung:
        msg: "given number {{number }} is greter than equal to 100"
    